pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "Final Mission"
include ':app'

// Redirigir el build directory de todos los proyectos a /tmp antes de la configuración
gradle.beforeProject { p ->
    if (p.name == 'app') {
        p.layout.buildDirectory.set(file("/tmp/finalmission_build"))
    } else {
        p.layout.buildDirectory.set(file("/tmp/finalmission_build/${p.name}"))
    }
}
